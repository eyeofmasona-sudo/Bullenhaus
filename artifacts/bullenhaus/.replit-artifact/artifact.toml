kind = "web"
previewPath = "/"
title = "Bullenhaus"
version = "1.0.0"
id = "artifacts/bullenhaus"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20546

[services.development]
run = "pnpm --filter @workspace/bullenhaus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bullenhaus", "run", "build" ]
publicDir = "artifacts/bullenhaus/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20546"
BASE_PATH = "/"
